# Starting values from docs/04 section 3.2. Phase 4 tunes them and records the outcome in DECISIONS.
NBA:
  half_life_days: 30
  k: 8 # Prior weight is k / (k + games).
  r: 0.35 # How far last season's rating regresses toward the mean.
  elo_k: 20
  elo_hfa: 100
  mu: 112.0 # League points per 100 possessions, used only before any history exists.
  tau: 99.0 # League possessions per regulation game, likewise.
  hca: 3.0 # Home edge per 100 possessions before any history exists.
  hca_k: 100 # Weight of last season's home edge, roughly in games (D55).
  regulation_minutes: 48
NCAA:
  half_life_days: 40
  k: 6
  r: 0.45
  elo_k: 25
  elo_hfa: 85
  mu: 103.0
  tau: 69.0
  hca: 5.0
  hca_k: 1000 # Measured on 2025-26 (D58). Phase 4 tunes it.
  regulation_minutes: 40

# Share of a player's minutes treated as missing (docs/04 section 3.3). Day-To-Day isn't in the
# docs: D29 asks the owner to review it. V1 models don't train on availability, per D15.
availability:
  status_weights:
    Out: 1.0
    Doubtful: 0.75
    Questionable: 0.4
    Day-To-Day: 0.4
  max_snapshot_age_hours: 48
