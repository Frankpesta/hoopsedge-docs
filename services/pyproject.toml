[project]
name = "hoopsedge"
version = "0.1.0"
description = "Private basketball prediction system for the NBA and NCAA Men's D1"
requires-python = "==3.12.*"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "mangum>=0.19",
    "numpy>=2",
    "polars>=1.5",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6",
    "rapidfuzz>=3.9",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "hypothesis>=2.0",
    "matplotlib>=3.9",
    "moto[dynamodb]>=5.0",
    "mypy>=1.11",
    "optuna>=4.0",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
    "types-pyyaml>=6",
]

# The source tree is mounted into the container and found through PYTHONPATH,
# so uv only needs to install dependencies, not build this project.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["hoopsedge", "tests"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "lightgbm.*", "matplotlib.*", "moto.*", "optuna.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

# CLAUDE.md section 5: strict typing on services/common.
[[tool.mypy.overrides]]
module = "hoopsedge.common.*"
strict = true
