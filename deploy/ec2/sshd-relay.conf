# /etc/ssh/sshd_config.d/60-hoopsedge-relay.conf on the EC2 server (D81).
#
# Lets the laptop's relay listen on the Docker bridge address, where the containers reach it,
# and nowhere else. Dead sessions are dropped within about 90 seconds, so a reconnecting relay
# can take the port back.
GatewayPorts clientspecified
PermitListen 172.17.0.1:1080
ClientAliveInterval 30
ClientAliveCountMax 3
