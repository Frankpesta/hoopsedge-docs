name: hoopsedge

services:
  dev:
    build:
      context: ./services
      target: dev
    image: hoopsedge-dev
    working_dir: /workspace/services
    volumes:
      - .:/workspace
    environment:
      HOOPSEDGE_ENV: local
      # Invariant 8: dry-run is the default in local environments.
      DRY_RUN: "true"
      # Tool caches stay out of the mounted repo.
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    # No AWS credentials are passed in, so local work cannot reach a real account.

  # The slate pipeline, run by hand, against the local database only. Locally it can't create
  # a real code (D71). It has its own service so that tests in `dev` never see this endpoint.
  pipeline:
    build:
      context: ./services
      target: dev
    image: hoopsedge-dev
    profiles: ["manual"]
    working_dir: /workspace/services
    depends_on:
      dynamodb:
        condition: service_healthy
    volumes:
      - .:/workspace
    environment:
      HOOPSEDGE_ENV: local
      DRY_RUN: "true"
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      # Dummy values the client insists on. They aren't credentials for anything.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

  # The daily cycle for local soak testing: dry-run slates, grading and learning. Started by hand.
  # The code is copied in, so switching branches can't break it. Rebuild it to pick up changes.
  # Set HOOPSEDGE_GIT_SHA to the commit built, or learning refuses to promote a new model.
  scheduler:
    build:
      context: ./services
      target: collector
    image: hoopsedge-scheduler
    profiles: ["manual"]
    command: ["python", "-m", "hoopsedge.pipeline.schedule"]
    restart: unless-stopped
    mem_limit: 4g
    depends_on:
      dynamodb:
        condition: service_healthy
    volumes:
      - ./data:/workspace/data
    environment:
      HOOPSEDGE_ENV: local
      # D83, D97: scheduled runs book real codes only when this is "false" in .env AND the
      # dashboard's Dry run switch is off. It stays true until go-live sign-off (brief Phase 8).
      DRY_RUN: ${HOOPSEDGE_SCHEDULED_DRY_RUN:-true}
      HOOPSEDGE_GIT_SHA: ${HOOPSEDGE_GIT_SHA:-}
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # The dashboard's API, locally, against the local database only. Started by hand. The secret
  # comes from the environment and is never committed. With none set, it refuses every request.
  api:
    build:
      context: ./services
      target: collector
    image: hoopsedge-api
    profiles: ["manual"]
    command: ["uvicorn", "hoopsedge.api.main:build_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    mem_limit: 3g
    depends_on:
      dynamodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/workspace/data
    environment:
      HOOPSEDGE_ENV: local
      # D97: Run now books real codes only when the dashboard's Dry run switch is off.
      DRY_RUN: "false"
      # So the System page can say what scheduled runs will do: the scheduler's own DRY_RUN.
      HOOPSEDGE_SCHEDULER_DRY_RUN: ${HOOPSEDGE_SCHEDULED_DRY_RUN:-true}
      HOOPSEDGE_API_KEY: ${HOOPSEDGE_API_KEY:-}
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # The dashboard locally, against the local API. Started by hand. The API key stays server-side.
  web:
    image: node:22-bookworm-slim
    profiles: ["manual"]
    working_dir: /workspace/web
    command: ["sh", "-c", "npm run build && npm run start"]
    restart: unless-stopped
    mem_limit: 3g
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace
      - web-modules:/workspace/web/node_modules
      - web-next:/workspace/web/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      HOOPSEDGE_API_URL: http://api:8000
      HOOPSEDGE_API_KEY: ${HOOPSEDGE_API_KEY:-}

  # Browser tests against a fake API, in the image that carries the browsers.
  web-e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: ["manual"]
    working_dir: /workspace/web
    mem_limit: 3g
    volumes:
      - .:/workspace
      - web-modules:/workspace/web/node_modules
      - web-next:/workspace/web/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

  # DynamoDB Local (D84), standing in for DynamoDB. Its database file lives in data/dynamodb, so
  # tickets, runs, aliases and settings survive restarts. Create that folder as your own user
  # before the first start (`mkdir -p data/dynamodb`): the container runs as uid 1000 and can't
  # write to a folder Docker creates as root. Nightly exports go to data/backups/dynamodb.
  dynamodb:
    image: amazon/dynamodb-local:3.1.0
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data", "-disableTelemetry"]
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./data/dynamodb:/home/dynamodblocal/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  web-modules:
  web-next:
