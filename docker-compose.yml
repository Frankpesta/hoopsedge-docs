name: hoopsedge

services:
  dev:
    build:
      context: ./services
      target: dev
    image: hoopsedge-dev
    working_dir: /workspace/services
    volumes:
      - .:/workspace
    environment:
      HOOPSEDGE_ENV: local
      # Invariant 8: dry-run is the default in local environments.
      DRY_RUN: "true"
      # Tool caches stay out of the mounted repo.
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    # No AWS credentials are passed in, so local work cannot reach a real account.

  # The slate pipeline, run by hand, against the stand-in database only. Locally it can't create
  # a real code (D71). It has its own service so that tests in `dev` never see this endpoint.
  pipeline:
    build:
      context: ./services
      target: dev
    image: hoopsedge-dev
    profiles: ["manual"]
    working_dir: /workspace/services
    depends_on:
      - aws-mock
    volumes:
      - .:/workspace
    environment:
      HOOPSEDGE_ENV: local
      DRY_RUN: "true"
      AWS_ENDPOINT_URL_DYNAMODB: http://aws-mock:5000
      # Dummy values the client insists on. They aren't credentials for anything.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local

  # The daily cycle for local soak testing: dry-run slates, grading and learning. Started by hand.
  # The code is copied in, so switching branches can't break it. Rebuild it to pick up changes.
  # Set HOOPSEDGE_GIT_SHA to the commit built, or learning refuses to promote a new model.
  scheduler:
    build:
      context: ./services
      target: collector
    image: hoopsedge-scheduler
    profiles: ["manual"]
    command: ["python", "-m", "hoopsedge.pipeline.schedule"]
    restart: unless-stopped
    mem_limit: 4g
    depends_on:
      - aws-mock
    volumes:
      - ./data:/workspace/data
    environment:
      HOOPSEDGE_ENV: local
      DRY_RUN: "true"
      HOOPSEDGE_GIT_SHA: ${HOOPSEDGE_GIT_SHA:-}
      AWS_ENDPOINT_URL_DYNAMODB: http://aws-mock:5000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # The dashboard's API, locally, against the stand-in database only. Started by hand. The secret
  # comes from the environment and is never committed. With none set, it refuses every request.
  api:
    build:
      context: ./services
      target: collector
    image: hoopsedge-api
    profiles: ["manual"]
    command: ["uvicorn", "hoopsedge.api.main:build_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    mem_limit: 3g
    depends_on:
      - aws-mock
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/workspace/data
    environment:
      HOOPSEDGE_ENV: local
      DRY_RUN: "true"
      HOOPSEDGE_API_KEY: ${HOOPSEDGE_API_KEY:-}
      AWS_ENDPOINT_URL_DYNAMODB: http://aws-mock:5000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # Early data collector (D13). Runs until AWS ingest takes over.
  collector:
    build:
      context: ./services
      target: collector
    image: hoopsedge-collector
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./data:/workspace/data
    environment:
      HOOPSEDGE_ENV: local
      DRY_RUN: "true"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # One-time historical download (docs/03 section 2.2). Safe to stop and start again.
  # Not restarted automatically: a block must stay stopped until the owner has reviewed it.
  backfill:
    build:
      context: ./services
      target: collector
    image: hoopsedge-backfill
    command: ["python", "-m", "hoopsedge.ingest.backfill", "fetch"]
    restart: "no"
    mem_limit: 512m
    volumes:
      - ./data:/workspace/data
    environment:
      HOOPSEDGE_ENV: local
      DRY_RUN: "true"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # Local stand-in for DynamoDB (BUILD-PLAN section 3). It forgets everything when it restarts,
  # which is safe: live ingest decides what it has processed from files, then refills the table.
  aws-mock:
    image: motoserver/moto:5.1.22
    restart: unless-stopped
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # Live ingest every 30 minutes (docs/03 section 2.4), against the stand-in only.
  live-ingest:
    build:
      context: ./services
      target: collector
    image: hoopsedge-live-ingest
    command: ["python", "-m", "hoopsedge.ingest.live", "run"]
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      - aws-mock
    volumes:
      - ./data:/workspace/data
    environment:
      HOOPSEDGE_ENV: local
      DRY_RUN: "true"
      AWS_ENDPOINT_URL_DYNAMODB: http://aws-mock:5000
      # Dummy values the client insists on. They aren't credentials for anything.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
