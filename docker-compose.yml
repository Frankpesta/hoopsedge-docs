name: hoopsedge

services:
  dev:
    build:
      context: ./services
      target: dev
    image: hoopsedge-dev
    working_dir: /workspace/services
    volumes:
      - .:/workspace
    environment:
      HOOPSEDGE_ENV: local
      # Invariant 8: dry-run is the default in local environments.
      DRY_RUN: "true"
      # Tool caches stay out of the mounted repo.
      RUFF_CACHE_DIR: /tmp/ruff
      MYPY_CACHE_DIR: /tmp/mypy
    # No AWS credentials are passed in, so local work cannot reach a real account.

  # Early data collector (D13). Runs until AWS ingest takes over.
  collector:
    build:
      context: ./services
      target: collector
    image: hoopsedge-collector
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - ./data:/workspace/data
    environment:
      HOOPSEDGE_ENV: local
      DRY_RUN: "true"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  # One-time historical download (docs/03 section 2.2). Safe to stop and start again.
  # Not restarted automatically: a block must stay stopped until the owner has reviewed it.
  backfill:
    build:
      context: ./services
      target: collector
    image: hoopsedge-backfill
    command: ["python", "-m", "hoopsedge.ingest.backfill", "fetch"]
    restart: "no"
    mem_limit: 512m
    volumes:
      - ./data:/workspace/data
    environment:
      HOOPSEDGE_ENV: local
      DRY_RUN: "true"
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
